# One-command deploy:   docker compose up --build
# Pick a backend:       BACKEND=express docker compose up --build   (spring | express | dotnet)
# Scale it out:         docker compose up --build --scale api=3
name: dropzone

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-dropzone}
  DB_USER: ${DB_USER:-dropzone}
  DB_PASSWORD: ${DB_PASSWORD:-dropzone}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dropzone}
      POSTGRES_USER: ${DB_USER:-dropzone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dropzone}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672" # management UI (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Applies db/migrations once; every backend runs against the result.
  migrate:
    image: flyway/flyway:10-alpine
    command: -url=jdbc:postgresql://postgres:5432/${DB_NAME:-dropzone} -user=${DB_USER:-dropzone} -password=${DB_PASSWORD:-dropzone} -locations=filesystem:/flyway/sql -connectRetries=20 migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backends/${BACKEND:-spring}
    environment:
      <<: *db-env
      PORT: "8000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-32-bytes}
      SIGNUP_CREDIT_CENTS: ${SIGNUP_CREDIT_CENTS:-50000}
      ADMIT_BATCH: ${ADMIT_BATCH:-50}
      ADMIT_INTERVAL_MS: ${ADMIT_INTERVAL_MS:-1000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-10}
      CACHE_TTL_SEC: ${CACHE_TTL_SEC:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Static UI + reverse proxy. /api/* is load-balanced across api replicas.
  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Flash-sale load test: docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:0.55.0
    profiles: ["loadtest"]
    command: run /scripts/drop-rush.js
    environment:
      BASE_URL: http://web/api
      USERS: ${USERS:-300}
      STOCK: ${STOCK:-50}
    volumes:
      - ./scripts/loadtest:/scripts:ro
    depends_on:
      - web

volumes:
  pgdata:
